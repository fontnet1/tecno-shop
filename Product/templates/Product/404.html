{% extends "base.html" %}
{% load static %}

{% block main %}
<div class="container-fluid py-5">
    <div class="row px-xl-5 justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="mb-4">
                <i class="fa fa-exclamation-triangle fa-5x text-warning mb-4 d-block"></i>
            </div>
            <h1 class="display-4 text-dark mb-3">404</h1>
            <h4 class="text-secondary mb-3">Page Not Found</h4>
            <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home:home' %}" class="btn btn-primary">
                    <i class="fa fa-home mr-2"></i> Go Home
                </a>
                <a href="{% url 'products:product_list' %}" class="btn btn-outline-dark">
                    <i class="fa fa-shopping-bag mr-2"></i> Browse Shop
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
